<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>센터 지대 납부금액 조회</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #f3f5f8; --panel: #ffffff; --fg: #18202e; --sub: #4b5565; --muted: #8a93a3; --line: #e6e9ef; --line2: #d4d9e1;
    --accent: #2d5be3; --accent-bg: #eaf0ff; --up: #d6342c; --up-bg: #fdeceb; --down: #1f63d1; --down-bg: #e8f0fd;
    --row-hover: #f6f8fc; --hl: #ffe9a8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111419; --panel: #191d24; --fg: #eceff3; --sub: #b6bdc8; --muted: #808999; --line: #262b34; --line2: #333a45;
      --accent: #84a2ff; --accent-bg: #1f2944; --up: #ff7e75; --up-bg: #3a1f1e; --down: #79b0ff; --down-bg: #1b2a40;
      --row-hover: #1f242c; --hl: #5a4a17; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-size: 15px; line-height: 1.5;
    font-family: "Pretendard Variable", Pretendard, "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 80px; }
  .num { font-variant-numeric: tabular-nums; }

  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  h1 { font-size: 24px; margin: 0; letter-spacing: -0.02em; }
  .status { color: var(--sub); font-size: 13px; margin-top: 4px; }
  .btn { font: inherit; font-size: 14px; font-weight: 600; padding: 9px 16px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line2); background: var(--panel); color: var(--fg); }
  .btn:hover { border-color: var(--accent); color: var(--accent); }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .drop { border: 2px dashed var(--line2); border-radius: 12px; background: var(--panel); padding: 36px 20px;
    text-align: center; cursor: pointer; display: block; }
  .drop.over { border-color: var(--accent); background: var(--accent-bg); }
  .drop .big { font-size: 17px; font-weight: 600; }
  .drop .big strong { color: var(--accent); }
  .drop .small { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .msg { font-size: 14px; margin: 10px 0 0; white-space: pre-line; }
  .msg.err { color: var(--up); } .msg.ok { color: var(--down); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); grid-auto-flow: column; margin-bottom: 20px; }
  .stats > div { padding: 18px 22px; min-width: 0; }
  .stats > div + div { border-left: 1px solid var(--line); }
  @media (max-width: 700px) { .stats { grid-auto-flow: row; grid-template-columns: 1fr; } }
  .k { color: var(--sub); font-size: 13px; font-weight: 500; }
  .stats .v { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin-top: 4px; }
  .stats .s { color: var(--muted); font-size: 13px; margin-top: 2px; }
  @media (max-width: 700px) { .stats > div + div { border-left: none; border-top: 1px solid var(--line); } }

  .searchbox { position: relative; margin-bottom: 14px; }
  .searchbox input { width: 100%; font: inherit; font-size: 17px; padding: 14px 44px 14px 46px; border-radius: 12px;
    border: 1px solid var(--line2); background: var(--panel); color: var(--fg); }
  .searchbox input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .searchbox svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .searchbox .clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); border: none; background: none;
    color: var(--muted); font-size: 22px; cursor: pointer; padding: 4px 8px; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line2); margin-bottom: 0; }
  .tabs button { font: inherit; font-size: 15px; font-weight: 600; padding: 11px 18px; border: none; background: none;
    color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; }
  .tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 0; color: var(--sub); font-size: 13px; }
  .toolbar select { font: inherit; font-size: 14px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line2);
    background: var(--panel); color: var(--fg); }

  .tbl { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 11px 16px; text-align: right; white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--panel); color: var(--sub); font-size: 13px; font-weight: 600;
    border-bottom: 1px solid var(--line2); }
  td { border-bottom: 1px solid var(--line); font-size: 15px; }
  tbody tr:last-child td { border-bottom: none; }
  th.l, td.l { text-align: left; }
  td.name { font-weight: 600; }
  td .code { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 6px; }
  tbody tr.click { cursor: pointer; }
  tbody tr.click:hover td { background: var(--row-hover); }
  tr.sum td { font-weight: 700; background: var(--bg); border-top: 1px solid var(--line2); }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--accent); }

  .chip { display: inline-block; padding: 2px 9px; border-radius: 999px; font-weight: 600; font-size: 14px; }
  .chip.up { color: var(--up); background: var(--up-bg); }
  .chip.down { color: var(--down); background: var(--down-bg); }
  .chip.zero { color: var(--muted); }
  .up { color: var(--up); } .down { color: var(--down); } .zero { color: var(--muted); }

  .result-head { color: var(--sub); font-size: 14px; margin: 4px 0 8px; }
  .center { padding: 24px 0 28px; border-bottom: 1px solid var(--line2); }
  .center:first-of-type { padding-top: 8px; }
  .center h2 { font-size: 22px; margin: 0; letter-spacing: -0.02em; }
  .center h2 .code { color: var(--muted); font-weight: 500; font-size: 15px; margin-left: 8px; }
  .center h2 .tag { font-size: 12px; font-weight: 600; color: var(--up); background: var(--up-bg); padding: 2px 8px;
    border-radius: 6px; margin-left: 8px; vertical-align: middle; }
  .meta { color: var(--sub); font-size: 14px; margin: 4px 0 16px; }
  .meta span + span::before { content: "·"; margin: 0 8px; color: var(--muted); }
  .figs { display: flex; flex-wrap: wrap; gap: 14px 44px; margin-bottom: 18px; }
  .figs .v { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin-top: 2px; }
  .figs .v.small { font-size: 20px; color: var(--sub); font-weight: 600; padding-top: 6px; }
  .figs .v .chip { font-size: 22px; padding: 2px 12px; }
  .detail td, .detail th { padding: 9px 16px; }
  tr.group td { color: var(--muted); font-size: 12px; font-weight: 600; text-align: left; padding: 14px 16px 4px;
    border-bottom: none; letter-spacing: 0.02em; }
  tr.total td { font-weight: 700; border-top: 2px solid var(--fg); background: var(--bg); }
  .note { color: var(--muted); font-size: 12px; margin-top: 8px; }
  mark { background: var(--hl); color: inherit; border-radius: 3px; padding: 0 1px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  @media (max-width: 640px) {
    th, td, .detail td, .detail th { padding: 9px 10px; }
    td { font-size: 14px; }
    .stats > div { padding: 14px 18px; }
    .stats .v { font-size: 22px; }
    .figs .v { font-size: 24px; }
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>센터 지대 납부금액 조회</h1>
      <div class="status" id="status">불러오는 중…</div>
    </div>
    <button class="btn" id="replace" hidden>새 파일로 교체</button>
  </header>

  <input type="file" id="file" accept=".xlsx,.xls" multiple hidden>
  <label class="drop" id="drop" for="file" hidden>
    <div class="big">지난달·이번달 엑셀 2개를 끌어놓거나 <strong>클릭해서 선택</strong></div>
    <div class="small">「지대청구 납부금액」 파일 · 업로드하면 새 파일을 올리기 전까지 모든 사람이 같은 내용을 봅니다</div>
  </label>
  <div class="msg" id="msg"></div>

  <section id="app" hidden>
    <div class="panel stats" id="stats"></div>

    <div class="searchbox">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="센터명 또는 센터코드 검색 (예: 구리, GB859)" autocomplete="off">
      <button class="clear" id="clear" title="지우기" hidden>×</button>
    </div>

    <div id="browse">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="branch" aria-selected="true">지사별</button>
        <button role="tab" data-tab="manager" aria-selected="false">담당별</button>
        <button role="tab" data-tab="center" aria-selected="false">센터별</button>
      </div>
      <div class="toolbar" id="toolbar"></div>
      <div id="tabbody"></div>
    </div>

    <div id="results" hidden></div>
  </section>
</main>

<script>
const PAY_SHEET = '지대청구 납부금액';
const BILL_SHEET = '통합청구(본사유치환불 반영)';
const PAY_COL = 10; // K열: 납부금액
// 통합청구 시트 구성: 청구 항목들의 합 = 총청구, 미수계 = 총청구 − 배달비 − 지원금 + 기타조정 + 매출할인
const DEDUCT = ['배달비', '지원금'];
const ADJUST = ['기타조정', '매출할인'];
const BILL_FIRST_ITEM = '이사연결';

let prev = null, cur = null, savedAt = null;
let rows = [];                     // 센터별 비교 행
let tab = 'branch', filterBranch = '', filterMgr = '';
let sort = { key: null, dir: -1 };

const $ = id => document.getElementById(id);
const won = n => (n < 0 ? '-' : '') + Math.abs(Math.round(n)).toLocaleString('ko-KR') + '원';
const num = v => {
  if (v == null || v === '') return 0;
  if (typeof v === 'number') return v;
  const n = Number(String(v).replace(/[,\s원]/g, ''));
  return isNaN(n) ? 0 : n;
};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = s => String(s ?? '').replace(/\s+/g, '').toLowerCase();
const ym = m => m ? `${m.slice(0, 4)}년 ${Number(m.slice(4))}월` : '';
const mon = m => m ? `${Number(m.slice(4))}월` : '';

function chip(d, words = true) {
  if (d > 0) return `<span class="chip up">▲ ${won(d)}${words ? ' 증가' : ''}</span>`;
  if (d < 0) return `<span class="chip down">▼ ${won(-d)}${words ? ' 감소' : ''}</span>`;
  return `<span class="chip zero">변동 없음</span>`;
}
function diffCell(d) {
  if (d > 0) return `<span class="up">+${won(d)}</span>`;
  if (d < 0) return `<span class="down">${won(d)}</span>`;
  return `<span class="zero">0</span>`;
}

/* ---------- 엑셀 파싱 ---------- */
function findSheet(wb, name, keyword) {
  if (wb.Sheets[name]) return wb.Sheets[name];
  const alt = wb.SheetNames.find(n => n.replace(/\s/g, '').includes(keyword));
  return alt ? wb.Sheets[alt] : null;
}

function parseWorkbook(wb, fileName) {
  const paySheet = findSheet(wb, PAY_SHEET, '납부금액');
  const billSheet = findSheet(wb, BILL_SHEET, '통합청구');
  if (!paySheet) throw new Error(`「${PAY_SHEET}」 시트가 없습니다.`);
  if (!billSheet) throw new Error(`「${BILL_SHEET}」 시트가 없습니다.`);

  // 납부금액 시트: '센터코드' 헤더 행 아래, 센터코드가 있는 행만 (담당자 요약·총합계 제외)
  const pay = XLSX.utils.sheet_to_json(paySheet, { header: 1, defval: null, raw: true });
  const hIdx = pay.findIndex(r => r && r.some(c => norm(c) === '센터코드'));
  if (hIdx < 0) throw new Error(`「${PAY_SHEET}」 시트에서 '센터코드' 헤더를 찾지 못했습니다.`);
  const h = pay[hIdx].map(norm);
  const ci = { dept: h.indexOf('부서'), mgr: h.indexOf('담당'), code: h.indexOf('센터코드'), name: h.indexOf('센터명'), head: h.indexOf('센터장') };
  const centers = [];
  let total = null;
  for (const r of pay.slice(hIdx + 1)) {
    if (!r) continue;
    const code = String(r[ci.code] ?? '').trim();
    if (!code) {
      if (r.some(c => norm(c) === '총합계')) total = num(r[PAY_COL]);
      continue;
    }
    centers.push({
      code, name: String(r[ci.name] ?? '').trim(), dept: String(r[ci.dept] ?? '').trim(),
      mgr: String(r[ci.mgr] ?? '').trim(), head: String(r[ci.head] ?? '').trim(), pay: num(r[PAY_COL]),
    });
  }
  if (total == null) total = centers.reduce((s, c) => s + c.pay, 0);

  // 통합청구 시트: 첫 행 헤더, '센터' 열이 센터코드
  const bill = XLSX.utils.sheet_to_json(billSheet, { header: 1, defval: null, raw: true });
  const bh = (bill[0] || []).map(c => String(c ?? '').trim());
  const bcode = bh.indexOf('센터'), bmonth = bh.indexOf('청구월');
  const first = bh.indexOf(BILL_FIRST_ITEM), totIdx = bh.indexOf('총청구'), dueIdx = bh.indexOf('미수계');
  if (bcode < 0 || dueIdx < 0 || totIdx < 0) throw new Error(`「${BILL_SHEET}」 시트의 헤더(센터/총청구/미수계)를 찾지 못했습니다.`);
  const items = bh.slice(first >= 0 ? first : 0, totIdx).filter(Boolean);
  const fields = [...items, '총청구', ...DEDUCT, ...ADJUST, '미수계'].filter(f => bh.includes(f));
  const billing = {};
  let month = null;
  for (const r of bill.slice(1)) {
    const code = r && String(r[bcode] ?? '').trim();
    if (!code) continue;
    if (!month && bmonth >= 0 && r[bmonth] != null) month = String(r[bmonth]).trim();
    billing[code] = fields.map(f => num(r[bh.indexOf(f)])); // fields 순서의 배열로 저장 (용량 절약)
  }

  // 청구월이 없으면 시트 제목(■ 26.09월) 또는 파일명(2026.09)에서 추정
  if (!month || !/^\d{6}$/.test(month)) {
    const title = String(pay[0]?.[0] ?? '');
    let m = title.match(/(\d{2})\.(\d{1,2})\s*월/);
    if (m) month = '20' + m[1] + m[2].padStart(2, '0');
    else if ((m = fileName.match(/(20\d{2})[.\-_ ]?(\d{2})/))) month = m[1] + m[2];
  }
  if (!month) throw new Error('청구월을 알 수 없습니다.');
  return { fileName, month, total, centers, billing, fields };
}

/* ---------- 저장/불러오기 ---------- */
function hydrate(m) {
  if (!m) return null;
  const idx = Object.fromEntries(m.fields.map((f, i) => [f, i]));
  const billing = new Map(Object.entries(m.billing).map(([code, arr]) => {
    const v = {};
    for (const f of m.fields) v[f] = arr[idx[f]] || 0;
    return [code, v];
  }));
  return { ...m, centers: new Map(m.centers.map(c => [c.code, c])), billing };
}

function setData(data) {
  const months = (data?.months || []).slice().sort((a, b) => a.month.localeCompare(b.month));
  cur = hydrate(months[months.length - 1]);
  prev = months.length > 1 ? hydrate(months[0]) : null;
  savedAt = data?.savedAt || null;
  buildRows();
  render();
}

async function load() {
  try {
    const r = await fetch('/api/data', { cache: 'no-store' });
    if (!r.ok) throw new Error();
    setData(await r.json());
  } catch {
    setData(null);
    showMsg('저장된 데이터를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.', 'err');
  }
}

async function handleFiles(fileList) {
  showMsg('');
  const parsed = [], errs = [];
  for (const f of fileList) {
    try {
      parsed.push(parseWorkbook(XLSX.read(await f.arrayBuffer(), { type: 'array' }), f.name));
    } catch (e) { errs.push(`${f.name}: ${e.message}`); }
  }
  if (errs.length) return showMsg(errs.join('\n'), 'err');
  const byMonth = new Map(parsed.map(p => [p.month, p]));
  // 파일 1개만 올렸고 저장된 이번달보다 최신이면, 저장된 이번달을 지난달로 사용
  if (byMonth.size === 1 && cur && [...byMonth.keys()][0] > cur.month) {
    const raw = await (await fetch('/api/data', { cache: 'no-store' })).json();
    const keep = raw?.months?.find(m => m.month === cur.month);
    if (keep) byMonth.set(keep.month, keep);
  }
  const months = [...byMonth.values()].sort((a, b) => a.month.localeCompare(b.month)).slice(-2);
  if (months.length < 2) return showMsg('지난달과 이번달, 서로 다른 달의 파일 2개를 올려주세요.', 'err');
  if (cur && !confirm(`저장된 ${ym(cur.month)} 데이터를 ${ym(months[1].month)}(지난달 ${mon(months[0].month)}) 데이터로 교체할까요?\n모든 사용자에게 바뀐 내용이 보입니다.`)) return;

  showMsg('저장 중…');
  const payload = { months };
  try {
    const r = await fetch('/api/data', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || r.status);
    payload.savedAt = j.savedAt;
    setData(payload);
    showMsg(`${ym(months[1].month)} 데이터로 저장했습니다.`, 'ok');
  } catch (e) {
    showMsg(`저장하지 못했습니다: ${e.message}`, 'err');
  }
}

function showMsg(t, kind = '') { const m = $('msg'); m.textContent = t; m.className = 'msg ' + kind; }

/* ---------- 집계 ---------- */
function buildRows() {
  rows = [];
  if (!cur) return;
  const codes = new Set([...cur.centers.keys(), ...(prev ? prev.centers.keys() : [])]);
  for (const code of codes) {
    const c = cur.centers.get(code), p = prev?.centers.get(code), info = c || p;
    const dueCur = cur.billing.get(code)?.['미수계'] || 0;
    const duePrev = prev?.billing.get(code)?.['미수계'] || 0;
    rows.push({ code, name: info.name, dept: info.dept || '(미지정)', mgr: info.mgr || '(미지정)', head: info.head,
      pay: c ? c.pay : null, payPrev: p ? p.pay : null, diff: prev ? dueCur - duePrev : 0, onlyPrev: !c, isNew: !!prev && !p });
  }
}

function groupBy(list, keyFn) {
  const m = new Map();
  for (const r of list) {
    const k = keyFn(r);
    if (!m.has(k)) m.set(k, { key: k, dept: r.dept, mgr: r.mgr, count: 0, pay: 0, diff: 0 });
    const g = m.get(k);
    if (!r.onlyPrev) g.count++;
    g.pay += r.pay || 0; g.diff += r.diff;
  }
  return [...m.values()];
}

/* ---------- 렌더링 ---------- */
function render() {
  const has = !!cur;
  $('drop').hidden = has;
  $('replace').hidden = !has;
  $('app').hidden = !has;
  if (!has) { $('status').textContent = '저장된 데이터가 없습니다. 파일을 올려주세요.'; return; }

  const when = savedAt ? new Date(savedAt).toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' }) : '';
  $('status').textContent = `${ym(cur.month)} 기준${prev ? ` · 비교 ${mon(prev.month)}` : ''}${when ? ` · ${when} 업로드` : ''}`;

  const dueSum = m => { let s = 0; for (const v of m.billing.values()) s += v['미수계'] || 0; return s; };
  const up = rows.filter(r => r.diff > 0).length, down = rows.filter(r => r.diff < 0).length;
  $('stats').innerHTML = `
    <div><div class="k">${mon(cur.month)} 총 납부금액</div><div class="v num">${won(cur.total)}</div>
      <div class="s">「지대청구 납부금액」 K열 합계</div></div>
    ${prev ? `<div><div class="k">전월 대비 (통합청구 미수계)</div><div class="v num">${chip(dueSum(cur) - dueSum(prev))}</div>
      <div class="s">${mon(prev.month)} → ${mon(cur.month)}</div></div>` : ''}
    <div><div class="k">대상 센터</div><div class="v num">${cur.centers.size.toLocaleString()}개</div>
      ${prev ? `<div class="s">증가 <span class="up">${up}</span> · 감소 <span class="down">${down}</span> · 변동 없음 ${rows.length - up - down}</div>` : ''}</div>`;
  update();
}

function update() {
  const raw = $('q').value.trim();
  const q = norm(raw);
  $('clear').hidden = !raw;
  $('browse').hidden = !!q;
  $('results').hidden = !q;
  if (q) renderSearch(q, raw); else renderTab();
}

function renderTab() {
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  const depts = [...new Set(rows.map(r => r.dept))].sort((a, b) => a.localeCompare(b, 'ko'));
  const sel = (id, label, opts, val) => `<label>${label} <select id="${id}"><option value="">전체</option>` +
    opts.map(o => `<option${o === val ? ' selected' : ''}>${esc(o)}</option>`).join('') + `</select></label>`;
  let list = rows.filter(r => !filterBranch || r.dept === filterBranch);

  let tb = '';
  if (tab !== 'branch') tb += sel('fBranch', '지사', depts, filterBranch);
  if (tab === 'center') {
    const mgrs = [...new Set(list.map(r => r.mgr))].sort((a, b) => a.localeCompare(b, 'ko'));
    if (!mgrs.includes(filterMgr)) filterMgr = '';
    tb += sel('fMgr', '담당', mgrs, filterMgr);
    list = list.filter(r => !filterMgr || r.mgr === filterMgr);
  }
  tb += `<span style="margin-left:auto">행을 누르면 ${tab === 'center' ? '상세 내역' : '하위 목록'}을 볼 수 있습니다</span>`;
  $('toolbar').innerHTML = tb;
  $('fBranch')?.addEventListener('change', e => { filterBranch = e.target.value; filterMgr = ''; renderTab(); });
  $('fMgr')?.addEventListener('change', e => { filterMgr = e.target.value; renderTab(); });

  const diffHead = prev ? `<th class="sortable" data-sort="diff">전월 대비${arrow('diff')}</th>` : '';
  const diffTd = d => prev ? `<td>${chip(d, false)}</td>` : '';
  const sum = list.reduce((s, r) => ({ pay: s.pay + (r.pay || 0), diff: s.diff + r.diff, count: s.count + (r.onlyPrev ? 0 : 1) }), { pay: 0, diff: 0, count: 0 });
  let head, body;

  if (tab === 'center') {
    const data = sorted(list, 'name');
    head = `<th class="l sortable" data-sort="name">센터${arrow('name')}</th><th class="l">지사</th><th class="l">담당</th>
      <th class="sortable" data-sort="pay">${mon(cur.month)} 납부금액${arrow('pay')}</th>${diffHead}`;
    body = data.map(r => `<tr class="click" data-code="${esc(r.code)}"><td class="l name">${esc(r.name)}<span class="code">${esc(r.code)}</span></td>
      <td class="l">${esc(r.dept)}</td><td class="l">${esc(r.mgr)}</td><td>${r.pay == null ? '<span class="zero">이번달 없음</span>' : won(r.pay)}</td>${diffTd(r.diff)}</tr>`).join('');
    body += `<tr class="sum"><td class="l">합계</td><td class="l" colspan="2">${sum.count}개 센터</td><td>${won(sum.pay)}</td>${prev ? `<td>${diffCell(sum.diff)}</td>` : ''}</tr>`;
  } else {
    const isB = tab === 'branch';
    const groups = sorted(groupBy(list, r => isB ? r.dept : r.dept + '\u0000' + r.mgr), 'key');
    head = `${isB ? '' : '<th class="l">지사</th>'}<th class="l sortable" data-sort="key">${isB ? '지사' : '담당'}${arrow('key')}</th>
      <th class="sortable" data-sort="count">센터 수${arrow('count')}</th><th class="sortable" data-sort="pay">${mon(cur.month)} 납부금액${arrow('pay')}</th>${diffHead}`;
    body = groups.map(g => `<tr class="click" data-dept="${esc(g.dept)}" data-mgr="${isB ? '' : esc(g.mgr)}">
      ${isB ? '' : `<td class="l">${esc(g.dept)}</td>`}<td class="l name">${esc(isB ? g.dept : g.mgr)}</td>
      <td>${g.count.toLocaleString()}</td><td>${won(g.pay)}</td>${diffTd(g.diff)}</tr>`).join('');
    body += `<tr class="sum">${isB ? '' : '<td></td>'}<td class="l">합계</td><td>${sum.count.toLocaleString()}</td><td>${won(sum.pay)}</td>${prev ? `<td>${diffCell(sum.diff)}</td>` : ''}</tr>`;
  }
  $('tabbody').innerHTML = list.length
    ? `<div class="tbl"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
       ${prev ? '<div class="note">전월 대비 = 「통합청구(본사유치환불 반영)」 시트의 미수계를 지난달과 비교한 금액</div>' : ''}`
    : '<div class="empty">해당하는 센터가 없습니다.</div>';
}

function arrow(k) { return sort.key === k ? (sort.dir > 0 ? ' ↑' : ' ↓') : ''; }
function sorted(list, defKey) {
  const key = sort.key && (sort.key in (list[0] || {})) ? sort.key : defKey;
  const dir = sort.key === key ? sort.dir : 1;
  return list.slice().sort((a, b) => {
    const x = a[key], y = b[key];
    if (typeof x === 'string' || typeof y === 'string') return String(x ?? '').localeCompare(String(y ?? ''), 'ko') * dir;
    return ((x ?? -Infinity) - (y ?? -Infinity)) * dir;
  });
}

function renderSearch(q, raw) {
  const hits = rows.filter(r => norm(r.name).includes(q) || norm(r.code).includes(q))
    .sort((a, b) => (norm(b.name) === q || norm(b.code) === q) - (norm(a.name) === q || norm(a.code) === q) || a.name.localeCompare(b.name, 'ko'));
  const out = $('results');
  if (!hits.length) { out.innerHTML = `<div class="empty">'${esc(raw)}'에 해당하는 센터가 없습니다.</div>`; return; }
  const limit = 20;
  out.innerHTML = `<div class="result-head">검색 결과 ${hits.length}건</div>` +
    hits.slice(0, limit).map(r => centerHTML(r.code, q)).join('') +
    (hits.length > limit ? `<div class="empty">${hits.length}건 중 ${limit}건만 표시합니다. 검색어를 더 구체적으로 입력하세요.</div>` : '');
}

function highlight(text, q) {
  const s = String(text ?? '');
  const i = s.toLowerCase().indexOf(q);
  if (!q || i < 0) return esc(s);
  return esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + q.length)) + '</mark>' + esc(s.slice(i + q.length));
}

function centerHTML(code, q) {
  const cc = cur.centers.get(code), pc = prev?.centers.get(code), c = cc || pc;
  const bc = cur.billing.get(code), bp = prev?.billing.get(code);
  let tag = '';
  if (prev && !cc) tag = `<span class="tag">${mon(cur.month)} 파일에 없음</span>`;
  else if (prev && !pc) tag = `<span class="tag">신규 (${mon(prev.month)} 파일에 없음)</span>`;

  const figs = [`<div><div class="k">${mon(cur.month)} 실납부금액</div><div class="v num">${cc ? won(cc.pay) : '-'}</div></div>`];
  if (prev) {
    const d = (bc?.['미수계'] || 0) - (bp?.['미수계'] || 0);
    figs.push(`<div><div class="k">전월 대비 차이</div><div class="v num">${chip(d)}</div></div>`);
    figs.push(`<div><div class="k">${mon(prev.month)} 납부금액</div><div class="v small num">${pc ? won(pc.pay) : '-'}</div></div>`);
  }
  return `<div class="center">
    <h2>${highlight(c.name, q)}<span class="code">${highlight(c.code, q)}</span>${tag}</h2>
    <div class="meta"><span>${esc(c.dept)}</span><span>담당 ${esc(c.mgr)}</span><span>센터장 ${esc(c.head)}</span></div>
    <div class="figs">${figs.join('')}</div>
    ${prev ? detailTable(bp, bc) : ''}
  </div>`;
}

function detailTable(bp, bc) {
  const fields = [...new Set([...prev.fields, ...cur.fields])];
  const items = fields.filter(f => !['총청구', '미수계', ...DEDUCT, ...ADJUST].includes(f));
  const g = f => [bp?.[f] || 0, bc?.[f] || 0];
  const row = (label, f, sign = 1, cls = '') => {
    const [a, b] = g(f);
    return `<tr class="${cls}"><td class="l">${label}</td><td>${won(a)}</td><td>${won(b)}</td><td>${diffCell(b - a)}</td><td>${diffCell((b - a) * sign)}</td></tr>`;
  };
  const changed = f => { const [a, b] = g(f); return a !== b; };
  const chItems = items.filter(changed);
  let body = `<tr class="group"><td colspan="5">청구 항목${chItems.length ? '' : ' — 변동 없음'}</td></tr>`;
  body += chItems.map(f => row(f, f)).join('');
  if (fields.includes('총청구')) body += row('총청구', '총청구');
  const dd = DEDUCT.filter(f => fields.includes(f) && changed(f));
  if (dd.length) body += `<tr class="group"><td colspan="5">차감 항목 — 늘면 납부금액 감소</td></tr>` + dd.map(f => row(f, f, -1)).join('');
  const aa = ADJUST.filter(f => fields.includes(f) && changed(f));
  if (aa.length) body += `<tr class="group"><td colspan="5">조정 항목</td></tr>` + aa.map(f => row(f, f)).join('');
  body += row('미수계 (납부 기준)', '미수계', 1, 'total');
  return `<div class="tbl detail"><table>
    <thead><tr><th class="l">통합청구 항목</th><th>${mon(prev.month)}</th><th>${mon(cur.month)}</th><th>증감</th><th>납부 영향</th></tr></thead>
    <tbody>${body}</tbody></table></div>
    <div class="note">변동이 있는 항목만 표시합니다. 실납부금액(K열)은 미수계에 기입금·자동이체·가상계좌 대체 등이 반영된 금액이라 미수계와 다를 수 있습니다.</div>`;
}

/* ---------- 이벤트 ---------- */
const drop = $('drop');
$('file').addEventListener('change', e => { handleFiles([...e.target.files]); e.target.value = ''; });
$('replace').addEventListener('click', () => $('file').click());
['dragenter', 'dragover'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
document.addEventListener('drop', e => { if (e.dataTransfer?.files?.length) handleFiles([...e.dataTransfer.files]); });
$('q').addEventListener('input', update);
$('clear').addEventListener('click', () => { $('q').value = ''; update(); $('q').focus(); });
document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if (!b) return;
  tab = b.dataset.tab; sort = { key: null, dir: -1 }; renderTab();
});
$('tabbody').addEventListener('click', e => {
  const th = e.target.closest('th[data-sort]');
  if (th) {
    const k = th.dataset.sort;
    sort = { key: k, dir: sort.key === k ? -sort.dir : (k === 'name' || k === 'key' ? 1 : -1) };
    return renderTab();
  }
  const tr = e.target.closest('tr.click');
  if (!tr) return;
  if (tr.dataset.code) { $('q').value = tr.dataset.code; update(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  filterBranch = tr.dataset.dept; filterMgr = tr.dataset.mgr || '';
  tab = tab === 'branch' ? 'manager' : 'center';
  sort = { key: null, dir: -1 };
  renderTab();
});

load();
</script>
</body>
</html>
