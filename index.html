<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>센터 지대 납부금액 조회</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --fg: #1d2330; --muted: #6b7280; --line: #e3e6eb; --panel: #ffffff;
    --accent: #2f5bea; --up: #d93025; --down: #1a66d6; --zero: #6b7280; --hl: #fff7d6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --fg: #e8eaee; --muted: #9aa1ad; --line: #2a2f37; --panel: #1b1f26;
      --accent: #7d9bff; --up: #ff7b72; --down: #6cb6ff; --zero: #9aa1ad; --hl: #3a3420; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; font-size: 15px; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  .drop { border: 2px dashed var(--line); border-radius: 10px; background: var(--panel);
    padding: 22px; text-align: center; cursor: pointer; transition: border-color .15s; }
  .drop.over { border-color: var(--accent); }
  .drop strong { color: var(--accent); }
  .files { margin: 12px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--muted); }
  .files li { margin: 2px 0; }
  .files b { color: var(--fg); }
  .err { color: var(--up); font-size: 14px; margin-top: 10px; white-space: pre-line; }
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0;
    margin: 24px 0 8px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .summary div { padding: 12px 4px; }
  .summary .k { color: var(--muted); font-size: 13px; }
  .summary .v { font-size: 20px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .search { margin: 24px 0 8px; display: flex; gap: 8px; }
  .search input { flex: 1; font: inherit; font-size: 16px; padding: 11px 14px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--panel); color: var(--fg); min-width: 0; }
  .search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .hint { color: var(--muted); font-size: 13px; }
  .center { padding: 20px 0; border-bottom: 1px solid var(--line); }
  .center h2 { font-size: 18px; margin: 0 0 4px; }
  .center h2 small { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .nums { display: flex; flex-wrap: wrap; gap: 8px 32px; margin-bottom: 12px; }
  .nums .k { color: var(--muted); font-size: 13px; }
  .nums .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .up { color: var(--up); } .down { color: var(--down); } .zero { color: var(--zero); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr.group td { color: var(--muted); font-size: 12px; text-align: left; padding-top: 12px; border-bottom: none; }
  tr.total td { font-weight: 700; border-top: 2px solid var(--fg); }
  .tbl { overflow-x: auto; }
  .note { color: var(--muted); font-size: 12px; margin-top: 6px; }
  mark { background: var(--hl); color: inherit; }
</style>
</head>
<body>
<main>
  <h1>센터 지대 납부금액 조회</h1>
  <p class="sub">지난달·이번달 「지대청구 납부금액」 엑셀 2개를 올리면 이번달 납부금액과 전월 대비 차이를 보여줍니다. 파일은 브라우저 안에서만 읽히며 서버로 전송되지 않습니다.</p>

  <label class="drop" id="drop">
    <input type="file" id="file" accept=".xlsx,.xls" multiple hidden>
    <div>엑셀 파일 2개를 여기로 끌어놓거나 <strong>클릭해서 선택</strong></div>
    <ul class="files" id="files"></ul>
    <div class="err" id="err"></div>
  </label>

  <section id="app" hidden>
    <div class="summary" id="summary"></div>
    <div class="search">
      <input id="q" type="search" placeholder="센터명 또는 센터코드 검색 (예: 구리, GB859)" autocomplete="off">
    </div>
    <div id="results"></div>
  </section>
</main>

<script>
const PAY_SHEET = '지대청구 납부금액';
const BILL_SHEET = '통합청구(본사유치환불 반영)';
const PAY_COL = 10; // K열: 납부금액
// 통합청구 시트 구성: 청구 항목들의 합 = 총청구, 미수계 = 총청구 − 배달비 − 지원금 + 기타조정 + 매출할인
const DEDUCT = ['배달비', '지원금'];
const ADJUST = ['기타조정', '매출할인'];
const BILL_FIRST_ITEM = '이사연결';

let loaded = []; // 업로드된 파일 파싱 결과
let prev = null, cur = null;

const $ = id => document.getElementById(id);
const won = n => (n < 0 ? '-' : '') + Math.abs(Math.round(n)).toLocaleString('ko-KR') + '원';
const num = v => {
  if (v == null || v === '') return 0;
  if (typeof v === 'number') return v;
  const n = Number(String(v).replace(/[,\s원]/g, ''));
  return isNaN(n) ? 0 : n;
};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = s => String(s ?? '').replace(/\s+/g, '').toLowerCase();
const ym = m => m ? `${m.slice(0, 4)}년 ${Number(m.slice(4))}월` : '';
const mon = m => m ? `${Number(m.slice(4))}월` : '';

function diffText(d) {
  if (d > 0) return `<span class="up">▲ ${won(d)} 증가</span>`;
  if (d < 0) return `<span class="down">▼ ${won(-d)} 감소</span>`;
  return `<span class="zero">변동 없음</span>`;
}
function diffCell(d) {
  if (d > 0) return `<span class="up">+${won(d)}</span>`;
  if (d < 0) return `<span class="down">${won(d)}</span>`;
  return `<span class="zero">0</span>`;
}

function findSheet(wb, name, keyword) {
  if (wb.Sheets[name]) return wb.Sheets[name];
  const alt = wb.SheetNames.find(n => n.replace(/\s/g, '').includes(keyword));
  return alt ? wb.Sheets[alt] : null;
}

function parseWorkbook(wb, fileName) {
  const paySheet = findSheet(wb, PAY_SHEET, '납부금액');
  const billSheet = findSheet(wb, BILL_SHEET, '통합청구');
  if (!paySheet) throw new Error(`「${PAY_SHEET}」 시트가 없습니다.`);
  if (!billSheet) throw new Error(`「${BILL_SHEET}」 시트가 없습니다.`);

  // 납부금액 시트: '센터코드' 헤더 행 아래, 센터코드가 있는 행만 (담당자 요약·총합계 제외)
  const pay = XLSX.utils.sheet_to_json(paySheet, { header: 1, defval: null, raw: true });
  const hIdx = pay.findIndex(r => r && r.some(c => norm(c) === '센터코드'));
  if (hIdx < 0) throw new Error(`「${PAY_SHEET}」 시트에서 '센터코드' 헤더를 찾지 못했습니다.`);
  const h = pay[hIdx].map(norm);
  const col = k => h.indexOf(k);
  const ci = { dept: col('부서'), mgr: col('담당'), code: col('센터코드'), name: col('센터명'), head: col('센터장') };
  const centers = new Map();
  let total = null;
  for (const r of pay.slice(hIdx + 1)) {
    if (!r) continue;
    const code = String(r[ci.code] ?? '').trim();
    if (!code) {
      if (norm(r[ci.mgr]) === '총합계' || r.some(c => norm(c) === '총합계')) total = num(r[PAY_COL]);
      continue;
    }
    centers.set(code, {
      code, name: String(r[ci.name] ?? '').trim(), dept: r[ci.dept] ?? '', mgr: r[ci.mgr] ?? '',
      head: r[ci.head] ?? '', pay: num(r[PAY_COL]),
    });
  }
  if (total == null) total = [...centers.values()].reduce((s, c) => s + c.pay, 0);

  // 통합청구 시트: 첫 행 헤더, '센터' 열이 센터코드
  const bill = XLSX.utils.sheet_to_json(billSheet, { header: 1, defval: null, raw: true });
  const bh = (bill[0] || []).map(c => String(c ?? '').trim());
  const bcode = bh.indexOf('센터'), bmonth = bh.indexOf('청구월');
  const first = bh.indexOf(BILL_FIRST_ITEM), totIdx = bh.indexOf('총청구'), dueIdx = bh.indexOf('미수계');
  if (bcode < 0 || dueIdx < 0 || totIdx < 0) throw new Error(`「${BILL_SHEET}」 시트의 헤더(센터/총청구/미수계)를 찾지 못했습니다.`);
  const items = bh.slice(first >= 0 ? first : 0, totIdx).filter(Boolean);
  const fields = [...items, '총청구', ...DEDUCT, ...ADJUST, '미수계'].filter(f => bh.includes(f));
  const billing = new Map();
  let month = null;
  for (const r of bill.slice(1)) {
    const code = r && String(r[bcode] ?? '').trim();
    if (!code) continue;
    if (!month && bmonth >= 0 && r[bmonth] != null) month = String(r[bmonth]).trim();
    const v = {};
    for (const f of fields) v[f] = num(r[bh.indexOf(f)]);
    v._name = r[bh.indexOf('센터명')];
    billing.set(code, v);
  }

  // 청구월이 없으면 시트 제목(■ 26.09월) 또는 파일명(2026.09)에서 추정
  if (!month || !/^\d{6}$/.test(month)) {
    const title = String(pay[0]?.[0] ?? '');
    let m = title.match(/(\d{2})\.(\d{1,2})\s*월/);
    if (m) month = '20' + m[1] + m[2].padStart(2, '0');
    else if ((m = fileName.match(/(20\d{2})[.\-_ ]?(\d{2})/))) month = m[1] + m[2];
  }
  if (!month) throw new Error('청구월을 알 수 없습니다.');
  return { fileName, month, centers, total, billing, items, fields };
}

async function handleFiles(fileList) {
  $('err').textContent = '';
  const errs = [];
  for (const f of fileList) {
    try {
      const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
      const parsed = parseWorkbook(wb, f.name);
      loaded = loaded.filter(x => x.month !== parsed.month); // 같은 월은 새 파일로 교체
      loaded.push(parsed);
    } catch (e) {
      errs.push(`${f.name}: ${e.message}`);
    }
  }
  loaded.sort((a, b) => a.month.localeCompare(b.month));
  if (loaded.length > 2) loaded = loaded.slice(-2); // 최근 2개월만 사용
  $('err').textContent = errs.join('\n');
  render();
}

function render() {
  $('files').innerHTML = loaded.map((x, i) =>
    `<li><b>${loaded.length === 2 ? (i === 1 ? '이번달' : '지난달') : '업로드'} · ${ym(x.month)}</b> — ${esc(x.fileName)}</li>`).join('');
  if (loaded.length === 0) { $('app').hidden = true; return; }
  if (loaded.length === 1) {
    $('err').textContent ||= '비교할 다른 달 파일을 1개 더 올려주세요.';
  }
  cur = loaded[loaded.length - 1];
  prev = loaded.length === 2 ? loaded[0] : null;
  $('app').hidden = false;

  const tCur = sumDue(cur), tPrev = prev ? sumDue(prev) : null;
  $('summary').innerHTML = `
    <div><div class="k">${mon(cur.month)} 총 납부금액 (K열 합계)</div><div class="v">${won(cur.total)}</div></div>
    <div><div class="k">대상 센터</div><div class="v">${cur.centers.size.toLocaleString()}개</div></div>
    ${prev ? `<div><div class="k">통합청구 미수계 전월 대비</div><div class="v">${diffText(tCur - tPrev)}</div></div>` : ''}`;
  search();
}

function sumDue(m) { let s = 0; for (const v of m.billing.values()) s += v['미수계'] || 0; return s; }

function search() {
  const q = norm($('q').value);
  const out = $('results');
  if (!cur) return;
  if (!q) { out.innerHTML = '<p class="hint">센터명 또는 센터코드를 입력하면 납부금액과 상세 차이가 바로 표시됩니다.</p>'; return; }
  const all = new Map();
  for (const m of [prev, cur]) if (m) for (const [code, c] of m.centers) all.set(code, c);
  const hits = [...all.values()].filter(c => norm(c.name).includes(q) || norm(c.code).includes(q))
    .sort((a, b) => (norm(a.name) === q ? -1 : 0) - (norm(b.name) === q ? -1 : 0) || a.name.localeCompare(b.name, 'ko'));
  if (!hits.length) { out.innerHTML = `<p class="hint">'${esc($('q').value)}'에 해당하는 센터가 없습니다.</p>`; return; }
  const limit = 30;
  out.innerHTML = hits.slice(0, limit).map(c => centerHTML(c.code, q)).join('') +
    (hits.length > limit ? `<p class="hint">검색 결과 ${hits.length}건 중 ${limit}건만 표시합니다. 검색어를 더 구체적으로 입력하세요.</p>` : '');
}

function highlight(text, q) {
  const s = String(text ?? '');
  const i = norm(s).indexOf(q);
  if (!q || i < 0 || /\s/.test(s)) return esc(s);
  return esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + q.length)) + '</mark>' + esc(s.slice(i + q.length));
}

function centerHTML(code, q) {
  const c = cur.centers.get(code) || prev?.centers.get(code);
  const pc = prev?.centers.get(code);
  const cc = cur.centers.get(code);
  const bc = cur.billing.get(code), bp = prev?.billing.get(code);

  let status = '';
  if (prev && !cc) status = ` <small>${mon(cur.month)} 파일에 없음</small>`;
  else if (prev && !pc) status = ` <small>${mon(prev.month)} 파일에 없음 (신규)</small>`;

  const nums = [`<div><div class="k">${mon(cur.month)} 납부금액</div><div class="v">${cc ? won(cc.pay) : '-'}</div></div>`];
  if (prev) {
    nums.push(`<div><div class="k">${mon(prev.month)} 납부금액</div><div class="v">${pc ? won(pc.pay) : '-'}</div></div>`);
    const d = (bc?.['미수계'] || 0) - (bp?.['미수계'] || 0);
    nums.push(`<div><div class="k">전월 대비 (통합청구 미수계)</div><div class="v">${diffText(d)}</div></div>`);
  }

  return `<div class="center">
    <h2>${highlight(c.name, q)}<small>${highlight(c.code, q)}</small>${status}</h2>
    <div class="meta">${esc(c.dept)} · 담당 ${esc(c.mgr)} · 센터장 ${esc(c.head)}</div>
    <div class="nums">${nums.join('')}</div>
    ${prev ? detailTable(bp, bc) : ''}
  </div>`;
}

function detailTable(bp, bc) {
  const fields = [...new Set([...prev.fields, ...cur.fields])];
  const items = fields.filter(f => !['총청구', '미수계', ...DEDUCT, ...ADJUST].includes(f));
  const g = f => [bp?.[f] || 0, bc?.[f] || 0];
  const row = (label, f, sign = 1, cls = '') => {
    const [a, b] = g(f);
    return `<tr class="${cls}"><td>${label}</td><td>${won(a)}</td><td>${won(b)}</td><td>${diffCell(b - a)}</td>` +
      `<td>${diffCell((b - a) * sign)}</td></tr>`;
  };
  const changed = f => { const [a, b] = g(f); return a !== b; };
  const chItems = items.filter(changed);
  let rows = '';
  rows += `<tr class="group"><td colspan="5">청구 항목${chItems.length ? '' : ' — 변동 없음'}</td></tr>`;
  rows += chItems.map(f => row(f, f)).join('');
  if (fields.includes('총청구')) rows += row('총청구', '총청구', 1);
  const dd = DEDUCT.filter(f => fields.includes(f) && changed(f));
  if (dd.length) rows += `<tr class="group"><td colspan="5">차감 항목 (늘면 납부금액 감소)</td></tr>` + dd.map(f => row(f, f, -1)).join('');
  const aa = ADJUST.filter(f => fields.includes(f) && changed(f));
  if (aa.length) rows += `<tr class="group"><td colspan="5">조정 항목</td></tr>` + aa.map(f => row(f, f, 1)).join('');
  rows += row('미수계 (납부 기준)', '미수계', 1, 'total');
  return `<div class="tbl"><table>
    <thead><tr><th>통합청구 항목</th><th>${mon(prev.month)}</th><th>${mon(cur.month)}</th><th>증감</th><th>납부 영향</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <div class="note">변동이 있는 항목만 표시합니다. 납부금액(K열)은 통합청구 미수계에 기입금·자동이체·가상계좌 대체 등이 반영된 금액이라 미수계와 다를 수 있습니다.</div>`;
}

const drop = $('drop');
$('file').addEventListener('change', e => { handleFiles([...e.target.files]); e.target.value = ''; });
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => handleFiles([...e.dataTransfer.files]));
$('q').addEventListener('input', search);
</script>
</body>
</html>
